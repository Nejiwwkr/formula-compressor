name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE 8.0.15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path 'ThirdParty/JUCE-8.0.15/JUCE/CMakeLists.txt')) {
            New-Item -ItemType Directory -Force -Path 'ThirdParty/JUCE-8.0.15' | Out-Null
            git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE.git 'ThirdParty/JUCE-8.0.15/JUCE'

            if ($LASTEXITCODE -ne 0) {
              throw "git clone failed with exit code $LASTEXITCODE"
            }
          }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B Build -G "Visual Studio 17 2022" -A x64 2>&1 | Tee-Object -FilePath configure.log

          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content configure.log -Tail 20) -join '%0A'
            Write-Host "::error title=Configure failed::$tail"
            exit 1
          }

      - name: Build
        run: cmake --build Build --config Release --target FormulaCompressor_VST3 FormulaCompressor_Standalone FormulaCompressorTests --parallel

      - name: Run tests
        run: .\Build\FormulaCompressorTests_artefacts\Release\FormulaCompressorTests.exe

      - name: Run pluginval
        shell: pwsh
        run: .\Tools\run_pluginval.ps1 -SkipGuiTests

      - name: Package
        shell: pwsh
        run: .\Tools\package_release.ps1 -SkipBuild

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: FormulaCompressor-win64
          path: |
            dist/FormulaCompressor-*-win64.zip
            Build/FormulaCompressor_artefacts/Release/VST3/Formula Compressor.vst3
            Build/FormulaCompressor_artefacts/Release/Standalone/Formula Compressor.exe

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem -Path dist -Filter 'FormulaCompressor-*-win64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'No release zip found' }
          gh release create $env:GITHUB_REF_NAME $zip.FullName --title "$env:GITHUB_REF_NAME" --generate-notes
