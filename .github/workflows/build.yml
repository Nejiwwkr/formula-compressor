name: Build

on:
  push:
    branches: [master, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B Build -G "Visual Studio 17 2022" -A x64 2>&1 | Tee-Object -FilePath configure.log

          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content configure.log -Tail 20) -join '%0A'
            Write-Host "::error title=Configure failed::$tail"
            exit 1
          }

      - name: Build
        run: cmake --build Build --config Release --target FormulaCompressor_VST3 FormulaCompressor_Standalone FormulaCompressorTests --parallel

      - name: Run tests
        run: .\Build\FormulaCompressorTests_artefacts\Release\FormulaCompressorTests.exe

      - name: UI screenshot smoke test
        run: |
          .\Build\FormulaCompressorTests_artefacts\Release\FormulaCompressorTests.exe --screenshot Build\ci-ui.png level
          .\Build\FormulaCompressorTests_artefacts\Release\FormulaCompressorTests.exe --screenshot Build\ci-ui-900.png level --size 900x680

      - name: Run pluginval
        shell: pwsh
        run: .\Tools\run_pluginval.ps1 -SkipGuiTests

      - name: Package
        shell: pwsh
        run: .\Tools\package_release.ps1 -SkipBuild

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $text = Get-Content -Raw CMakeLists.txt

          if ($text -notmatch 'project\s*\(\s*FormulaCompressor\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Could not read the project version from CMakeLists.txt'
          }

          if ("v$($Matches[1])" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match project version v$($Matches[1])"
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: FormulaCompressor-win64
          path: |
            dist/FormulaCompressor-*-win64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-diagnostics
          path: |
            configure.log
            Build/pluginval/pluginval.log
            Build/ci-ui.png
            Build/ci-ui-900.png
          if-no-files-found: ignore

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: FormulaCompressor-win64
          path: dist

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(FormulaCompressor VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test "v$version" = "$GITHUB_REF_NAME"
          cd dist
          sha256sum -c SHA256SUMS.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(FormulaCompressor VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          zip="FormulaCompressor-$version-win64.zip"
          notes=$(awk -v ver="$version" '
            $0 ~ "^## " ver { inside=1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md)

          if [ -z "$notes" ]; then
            notes="See CHANGELOG.md in the release package."
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/$zip" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" "dist/$zip" dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Formula Compressor $GITHUB_REF_NAME" \
              --notes "$notes"
          fi
